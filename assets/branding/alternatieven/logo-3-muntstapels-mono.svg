<!-- Naam op het logo: Pot z'n Loatst. De letters zijn paden; pas bij een naamswijziging ook de paden aan. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title description">
  <title id="title">Pot z'n Loatst — Muntstapels (éénkleurig)</title>
  <desc id="description">Gestapelde munten vormen de P, o en t; hun hoogte loopt af. De laatste t van Loatst is uitgespaard in één munt die nog op zijn kant staat.</desc>
